name: Build documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# Forks and repository PRs only receive a read token. This job never publishes.
permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          check-latest: true
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Test the publisher's security boundaries
        run: python3 scripts/test-publish-pages.py
      - name: Build the site for its final URL
        run: npm run build
        env:
          SITE_BASE: ${{ github.event_name == 'pull_request' && format('/awesome-ai4chip/pr-preview/{0}/', github.event.pull_request.number) || '/awesome-ai4chip/' }}
      - name: Upload static files for the trusted publisher
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

